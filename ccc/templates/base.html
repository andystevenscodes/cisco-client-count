<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Cisco Client Count{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('dashboard') }}">Cisco Client Count<span>{{ version }}</span></a>
    <nav class="nav">
      <a href="{{ url_for('dashboard') }}" class="{{ 'active' if page == 'dashboard' }}">Dashboard</a>
      <a href="{{ url_for('raw') }}" class="{{ 'active' if page == 'raw' }}">Raw data</a>
      <a href="{{ url_for('translation') }}" class="{{ 'active' if page == 'translation' }}">Translation</a>
      <a href="{{ url_for('setup') }}" class="{{ 'active' if page == 'setup' }}">WLC setup</a>
      <a href="{{ url_for('powerbi') }}" class="{{ 'active' if page == 'powerbi' }}">Power BI</a>
    </nav>
    <form method="post" action="{{ url_for('logout') }}"><button type="submit">Sign out</button></form>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='common.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
